[RUNINFO]
save_models = True
data_dir = data/3.function/
force_cpu = False
run_name = function
dataset_name = function

[MODELINFO]
# model type 
# gcn, gat, sage, gin
gnn_type = gcn
global_encoder_type = sage
decoder_type = multiclass
# model parameters
link_prediction_mode = target, compound
hidden_channels = 192
local_encoder_num_heads = 2
local_diffpool_clusters = 30
final_activation = True
conv_with_linears = False
num_encoding_layers = 3
conv_aggregation_operator = mean
use_edge_decoder_dropout = True
use_dtis = False

[RUNPARAMS]
seed = 123456
epochs = 400
learning_rate = 0.0005
loss_function = ce
penalize_false_negative = False
batch_size = 2048
num_neighbors = 10,10
num_workers = 8

[INPUT_FILES]
ppi_database = data/9606.protein.physical.links.v12.0.txt
mapping_file = data/Mapping_Uniprot2Ensp.csv
human_proteins = data/Human_Protein.csv
average_screenings = False

[OUTPUT_FILES]
learning_curve = learning_curve_example.png

[COMPOUND_FEATURES]
compound_similarities = True
compound_similarities_threshold = 0.85

[PROTEIN_FEATURES]
protein_protein_interactions = True
ppi_comb_score_threshold = 460 #  360 is mean of all human string score